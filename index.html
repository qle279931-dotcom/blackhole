<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLACK HOLE 3D</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #05070d;
      color: #e8eef5;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    p {
      margin: 4px 0 0;
      color: #8d9bb0;
    }

    #khung {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 90px;
      bottom: 16px;
      border: 2px dashed #2a3550;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8d9bb0;
    }
  </style>
</head>

<body>

  <header>
    <h1>BLACK HOLE 3D</h1>
    <p>Mô phỏng độ cong không–thời gian quanh hố đen</p>
  </header>

  <div id="khung">Khu vực mô hình 3D sẽ hiện ở đây</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

  <!-- B7 - nạp OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>

    const khung = document.getElementById('khung');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      45,
      khung.clientWidth / khung.clientHeight,
      1,
      2000
    );

    camera.position.set(0, 120, 230);
    camera.lookAt(0, -30, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      khung.clientWidth,
      khung.clientHeight
    );

    renderer.setClearColor(0x05070d);
    khung.appendChild(renderer.domElement);


    // =========================
    // B7 - ĐIỀU KHIỂN 3D
    // =========================

    const dieuKhien = new THREE.OrbitControls(
      camera,
      renderer.domElement
    );

    dieuKhien.target.set(0, -30, 0);
    dieuKhien.enableDamping = true;
    dieuKhien.autoRotate = true;
    dieuKhien.autoRotateSpeed = 0.8;
    dieuKhien.minDistance = 120;
    dieuKhien.maxDistance = 500;


    // B7 - thay đổi kích thước màn hình
    window.addEventListener('resize', () => {

      camera.aspect =
        khung.clientWidth / khung.clientHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        khung.clientWidth,
        khung.clientHeight
      );

    });


    // =========================
    // B4 - ĐỘ CONG KHÔNG-THỜI GIAN
    // =========================

    function doCao(r) {
      return -80 * Math.exp(
        -(r / 45) * (r / 45)
      );
    }

    const matLuoi = new THREE.LineBasicMaterial({
      color: 0x6fa8c7
    });

    const BAN_KINH = 100;


    // Lưới dày hơn
    for (let r = 20; r <= BAN_KINH; r += 10) {

      const diem = [];

      for (let i = 0; i <= 100; i++) {

        const goc = (i / 100) * Math.PI * 2;

        diem.push(
          new THREE.Vector3(
            r * Math.cos(goc),
            doCao(r),
            r * Math.sin(goc)
          )
        );

      }

      const hinh =
        new THREE.BufferGeometry().setFromPoints(diem);

      scene.add(
        new THREE.Line(hinh, matLuoi)
      );

    }


    // Các đường tỏa ra từ tâm
    for (let k = 0; k < 24; k++) {

      const goc = (k / 24) * Math.PI * 2;
      const diem = [];

      for (let r = 0; r <= BAN_KINH; r += 5) {

        diem.push(
          new THREE.Vector3(
            r * Math.cos(goc),
            doCao(r),
            r * Math.sin(goc)
          )
        );

      }

      const hinh =
        new THREE.BufferGeometry().setFromPoints(diem);

      scene.add(
        new THREE.Line(hinh, matLuoi)
      );

    }


    // =========================
    // B3 - HỐ ĐEN
    // =========================

    const RB = 15;

    const hoDen = new THREE.Mesh(
      new THREE.SphereGeometry(RB, 32, 24),
      new THREE.MeshBasicMaterial({
        color: 0x000000
      })
    );

    hoDen.position.set(
      0,
      doCao(0) + RB,
      0
    );

    scene.add(hoDen);


    // Vòng chân trời sự kiện
    const vong = new THREE.Mesh(
      new THREE.TorusGeometry(
        22,
        1.5,
        16,
        64
      ),
      new THREE.MeshBasicMaterial({
        color: 0xffb347
      })
    );

    vong.rotation.x = Math.PI / 2;

    vong.position.set(
      0,
      doCao(0) + RB,
      0
    );

    scene.add(vong);


    // =========================
    // B5 - CÁC TIA ÁNH SÁNG
    // =========================

    function taoTia(b, K, mau) {

      let x = -110, z = b;
      let vx = 1, vz = 0;

      const diem = [];

      for (let i = 0; i < 400; i++) {

        const r =
          Math.sqrt(x * x + z * z);

        if (
          r < RB + 5 ||
          Math.abs(x) > 112 ||
          Math.abs(z) > 112
        ) break;

        diem.push(
          new THREE.Vector3(
            x,
            doCao(r) + 3,
            z
          )
        );

        const luc =
          -K / Math.pow(r * r + 400, 1.5);

        vx += luc * x * 1.2;
        vz += luc * z * 1.2;

        const dai =
          Math.sqrt(vx * vx + vz * vz);

        vx /= dai;
        vz /= dai;

        x += vx * 1.2;
        z += vz * 1.2;

      }

      const duong =
        new THREE.CatmullRomCurve3(diem);

      const ong = new THREE.Mesh(
        new THREE.TubeGeometry(
          duong,
          200,
          0.8,
          6
        ),
        new THREE.MeshBasicMaterial({
          color: mau
        })
      );

      scene.add(ong);

      return duong;

    }


    const duongTia = [
      taoTia(80, 12, 0xffe08a),
      taoTia(60, 12, 0xffb347),
      taoTia(40, 12, 0xff7a59)
    ];


    // =========================
    // B6 - HẠT SÁNG CHẠY
    // =========================

    const hat = duongTia.map(() =>
      new THREE.Mesh(
        new THREE.SphereGeometry(
          2.5,
          12,
          12
        ),
        new THREE.MeshBasicMaterial({
          color: 0xffffff
        })
      )
    );

    hat.forEach(h => scene.add(h));


    function chay() {

      requestAnimationFrame(chay);

      const t =
        performance.now() / 1000;

      hat.forEach((h, i) => {

        const tienDo =
          (t * (0.12 + i * 0.02) +
          i * 0.3) % 1;

        h.position.copy(
          duongTia[i].getPointAt(tienDo)
        );

      });


      // B7 - cập nhật điều khiển
      dieuKhien.update();


      renderer.render(
        scene,
        camera
      );

    }

    chay();

  </script>

</body>
</html>
